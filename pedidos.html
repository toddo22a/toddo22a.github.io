<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>TODDO Pedidos</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --line:#2a2a2a; --line-2:#3a3a3a;
  --fg:#f6f6f4; --muted:#a3a3a0; --y:#fdba09; --y-fg:#fdba09; --y-soft:rgba(253,186,9,.13); --ink:#111;
  --ok:#29c46a; --wa:#25d366; --danger:#ff5d52; --info:#5aa9ff;
  --f-display:"Poppins","Arial Black",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f5f1; --surface:#fff; --surface-2:#f1efe8; --line:#e4e1d8; --line-2:#d3cfc3; --fg:#111; --muted:#5f5d57; --y-fg:#946500; --y-soft:rgba(253,186,9,.2);
  --ok:#16884a; --danger:#d23a2f; --info:#1f6fd1; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f5f1; --surface:#fff; --surface-2:#f1efe8; --line:#e4e1d8; --line-2:#d3cfc3; --fg:#111; --muted:#5f5d57; --y-fg:#946500; --y-soft:rgba(253,186,9,.2);
  --ok:#16884a; --danger:#d23a2f; --info:#1f6fd1; color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
img.logo-l{display:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) img.logo-d{display:none}:root:not([data-theme="dark"]) img.logo-l{display:block}}
:root[data-theme="light"] img.logo-d{display:none}:root[data-theme="light"] img.logo-l{display:block}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.hbar img{height:26px;width:auto}
.hbar h1{font:700 17px/1 var(--f-display);margin:0;padding-left:12px;border-left:1px solid var(--line-2)}
.hbar .sp{flex:1}
.ibtn{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:13px;font-weight:600;gap:6px;grid-auto-flow:column}
.ibtn:hover{border-color:var(--y)}
.ibtn svg{width:18px;height:18px}

main{padding-block:18px 60px;display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 24px/1.1 var(--f-display)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.hl{background:var(--y);border-color:var(--y);color:var(--ink)}.stat.hl span{color:rgba(0,0,0,.65)}
.tools{display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:0}
.search svg{color:var(--muted);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip small{opacity:.6;margin-left:4px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.list{display:grid;gap:12px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.order.is-new{border-color:var(--y)}
.o-head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;width:100%;text-align:left;background:transparent;border:0}
.o-code{font:700 15px/1.2 var(--f-display);letter-spacing:.01em}
.o-date{font-size:12px;color:var(--muted)}
.o-who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.o-who b{font-weight:600}
.o-who span{color:var(--muted)}
.badge{align-self:start;justify-self:end;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.b-nuevo{background:var(--y);color:var(--ink);border-color:var(--y)}
.b-esperando{background:transparent;color:var(--y-fg);border-color:var(--y)}
.b-pago{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.b-prov,.b-enviado{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.b-entregado{background:var(--ok);color:#fff;border-color:var(--ok)}
.b-cancelado{text-decoration:line-through}
.o-items{display:grid;gap:8px;padding:0 16px 12px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.it img,.it .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface-2);display:block}
.it-n{font-size:14px;line-height:1.3;min-width:0}
.it-n small{display:block;color:var(--muted);font-size:12px}
.it-p{font-weight:600;font-size:14px}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.money div{background:var(--surface);padding:10px 16px}
.money span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.money b{font-size:15px}
.money .now b{color:var(--y-fg)}
.warn{margin:0 16px 12px;font-size:13px;background:var(--y-soft);border-radius:10px;padding:8px 12px}
.o-body{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:14px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--y);color:var(--ink);text-decoration:none}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--y)}
.field textarea{min-height:64px;resize:vertical}
.field.full{grid-column:1/-1}
.saved{font-size:13px;color:var(--ok);align-self:center}
.guide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:14px;padding:12px}
.guide-ph{width:84px;height:84px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.guide-ph img{width:100%;height:100%;object-fit:cover;display:block}
.guide-ph svg{width:28px;height:28px}
.guide-b{display:grid;gap:8px;min-width:0}
.guide-b b{font-size:14px}
.guide-b small{color:var(--muted);font-size:12px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.send{grid-column:1/-1;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.send p{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:640px){.guide{grid-template-columns:1fr}.guide-ph{width:100%;height:160px}}

.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:grid;gap:16px}
.card img{height:34px;width:auto;justify-self:start}
.card h2{font:700 22px/1.2 var(--f-display);margin:0}
.card p{margin:0;color:var(--muted);font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:1px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line-2);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbar h1{font-size:15px}
  .ibtn .lbl{display:none}
  .edit{grid-template-columns:1fr}
  .kv{grid-template-columns:98px 1fr}
  .money div{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var KEY_STORE="toddo-admin-key";
var STATES=["Nuevo","Esperando pago","Pago recibido","Pedido en proveedor","Enviado","Entregado","Cancelado"];
var BADGE={"Nuevo":"b-nuevo","Esperando pago":"b-esperando","Pago recibido":"b-pago","Pedido en proveedor":"b-prov","Enviado":"b-enviado","Entregado":"b-entregado","Cancelado":"b-cancelado"};
var st={url:"",key:"",orders:[],products:{},filter:"Activos",q:"",open:{},loading:false,files:{},prev:{},busy:{},err:"",logo:"img/logo.png",logoL:"img/logo-oscuro.png"};
var app=document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function cop(n){ var x=Number(n); if(n===""||n===null||isNaN(x)) return "—"; return "$"+Math.round(x).toLocaleString("es-CO"); }
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch(e){} }
function toast(t){ var old=document.querySelector(".toast"); if(old) old.remove(); var d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); },2600); }
function fdate(iso){ var d=new Date(iso); if(isNaN(d)) return esc(iso); return d.toLocaleDateString("es-CO",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"}); }
function waPhone(p){ var d=String(p||"").replace(/\D/g,""); if(d.length===10 && d[0]==="3") d="57"+d; return d; }
var I={
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>'
};
function logoImg(h){ return '<img class="logo-d" src="'+esc(st.logo)+'" alt="TODDO" style="height:'+h+'px"><img class="logo-l" src="'+esc(st.logoL)+'" alt="TODDO" style="height:'+h+'px">'; }

function api(body){
  body.key=st.key;
  return fetch(st.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){ return r.json(); });
}

/* ---------- views ---------- */
function loginView(){
  if(!st.url){
    app.innerHTML='<div class="login gut"><div class="card">'+logoImg(34)+'<h2>Bandeja de pedidos</h2><p>Esta bandeja todavía no está conectada a tu hoja de pedidos. Cuando tengas el enlace de tu hoja (el que termina en <b>/exec</b>), pásaselo a Claude para activarla.</p></div></div>';
    return;
  }
  app.innerHTML='<div class="login gut"><form class="card" id="lf" autocomplete="on">'+logoImg(34)+'<h2>Bandeja de pedidos</h2><p>Solo para la administración de la tienda.</p>'+
    '<div class="field"><label for="k">Clave</label><input id="k" type="password" autocomplete="current-password" required></div>'+
    '<label class="check"><input type="checkbox" id="rem" checked> Recordarme en este dispositivo</label>'+
    '<div class="err" id="lerr" role="alert">'+esc(st.err)+'</div><button class="btn" type="submit" id="lb">Entrar</button></form></div>';
  document.getElementById("lf").addEventListener("submit",function(ev){
    ev.preventDefault();
    st.key=document.getElementById("k").value.trim();
    var rem=document.getElementById("rem").checked, b=document.getElementById("lb");
    b.disabled=true; b.textContent="Entrando…";
    load().then(function(ok){ if(ok){ lsSet(KEY_STORE, rem?st.key:""); } else { b.disabled=false; b.textContent="Entrar"; } });
  });
  var k=document.getElementById("k"); if(k) k.focus();
}

function load(){
  st.loading=true; if(st.orders.length) mainView();
  return api({action:"list"}).then(function(r){
    st.loading=false;
    if(!r.ok){ st.err=r.error==="clave"?"Clave incorrecta.":"No se pudieron cargar los pedidos."; st.key=""; lsSet(KEY_STORE,""); loginView(); return false; }
    st.err=""; st.orders=r.pedidos||[]; mainView(); return true;
  }).catch(function(){
    st.loading=false; st.err="No hay conexión con tu hoja de pedidos. Revisa tu internet e intenta de nuevo.";
    if(st.orders.length){ mainView(); toast("No se pudo actualizar"); } else loginView();
    return false;
  });
}

function group(o){
  if(st.filter==="Todos") return true;
  if(st.filter==="Activos") return o.estado!=="Entregado" && o.estado!=="Cancelado";
  return o.estado===st.filter;
}
function match(o){
  if(!st.q) return true;
  var q=st.q.toLowerCase();
  return [o.code,o.name,o.last,o.phone,o.city,o.dept].concat((o.items||[]).map(function(i){return i.name+" "+i.code;})).join(" ").toLowerCase().indexOf(q)>-1;
}

function mainView(){
  var O=st.orders, cnt={};
  O.forEach(function(o){ cnt[o.estado]=(cnt[o.estado]||0)+1; });
  var activos=O.filter(function(o){return o.estado!=="Entregado"&&o.estado!=="Cancelado";}).length;
  var now=new Date(), month=O.filter(function(o){ var d=new Date(o.fecha); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()&&o.estado!=="Cancelado"; });
  var monthSales=month.filter(function(o){return o.estado==="Entregado";}).reduce(function(a,o){ return a+(Number(o.sub)||0)-(Number(o.disc)||0); },0);
  var porCobrar=(cnt["Nuevo"]||0)+(cnt["Esperando pago"]||0);
  var list=O.filter(group).filter(match);
  var chips=["Activos","Todos"].concat(STATES);
  var h='<header class="gut"><div class="wrap hbar">'+logoImg(26)+'<h1>Pedidos</h1><span class="sp"></span>'+
    '<button class="ibtn" data-act="refresh" aria-label="Actualizar">'+(st.loading?I.refresh.replace('<svg','<svg class="spin"'):I.refresh)+'<span class="lbl">Actualizar</span></button>'+
    '<button class="ibtn" data-act="logout" aria-label="Salir">'+I.out+'<span class="lbl">Salir</span></button></div></header>'+
    '<main class="gut"><div class="wrap" style="display:grid;gap:16px">'+
    '<div class="stats"><div class="stat hl"><b class="num">'+(cnt["Nuevo"]||0)+'</b><span>Nuevos</span></div><div class="stat"><b class="num">'+porCobrar+'</b><span>Por cobrar</span></div><div class="stat"><b class="num">'+activos+'</b><span>Activos</span></div><div class="stat"><b class="num">'+month.length+'</b><span>Pedidos del mes</span></div></div>'+
    (monthSales?'<p style="margin:-6px 0 0;font-size:13px;color:var(--muted)">Entregado este mes: <b class="num" style="color:var(--fg)">'+cop(monthSales)+'</b> en productos.</p>':'')+
    '<div class="tools"><label class="search">'+I.search+'<input id="q" type="search" placeholder="Buscar por nombre, celular, ciudad o N.° de pedido" value="'+esc(st.q)+'" aria-label="Buscar pedidos"></label>'+
    '<div class="chips" role="tablist">'+chips.map(function(c){ var n=c==="Todos"?O.length:c==="Activos"?activos:(cnt[c]||0); return '<button class="chip'+(st.filter===c?' on':'')+'" data-filter="'+esc(c)+'" role="tab" aria-selected="'+(st.filter===c)+'">'+esc(c)+'<small class="num">'+n+'</small></button>'; }).join('')+'</div></div>'+
    '<div class="list">'+(list.length?list.map(orderHtml).join(''):'<div class="empty">'+(O.length?'No hay pedidos con este filtro.':'Todavía no tienes pedidos. Cuando un cliente cierre un pedido en la tienda, aparecerá aquí.')+'</div>')+'</div>'+
    '<p style="font-size:12px;color:var(--muted);margin:8px 0 0">Los pedidos se guardan cuando el cliente toca “Cerrar pedido por WhatsApp”. Si un pedido “Nuevo” no te llegó por WhatsApp, puedes escribirle al cliente para recuperarlo.</p>'+
    '</div></main>';
  var y=window.scrollY, focusQ=document.activeElement&&document.activeElement.id==="q", sel=focusQ?document.activeElement.selectionStart:null;
  app.innerHTML=h;
  window.scrollTo(0,y);
  if(focusQ){ var q=document.getElementById("q"); q.focus(); try{ q.setSelectionRange(sel,sel); }catch(e){} }
}

function itemHtml(i){
  var p=st.products[i.code], img=p&&p.images&&p.images[0];
  return '<div class="it">'+(img?'<img src="'+esc(img)+'" alt="" loading="lazy">':'<span class="ph"></span>')+'<div class="it-n">'+esc(i.qty)+' × '+esc(i.name)+(i.opt?' ('+esc(i.opt)+')':'')+'<small>Código '+esc(i.code)+'</small></div><div class="it-p num">'+cop((Number(i.price)||0)*(Number(i.qty)||1))+'</div></div>';
}
function orderHtml(o){
  var open=!!st.open[o.code], full=String(o.pago||"").indexOf("total")>-1, ships=Number(o.shipments)||((o.items||[]).length);
  var h='<article class="order'+(o.estado==="Nuevo"?' is-new':'')+'"><button class="o-head" data-toggle="'+esc(o.code)+'" aria-expanded="'+open+'">'+
    '<div><div class="o-code">'+esc(o.code)+'</div><div class="o-date">'+fdate(o.fecha)+'</div></div><span class="badge '+(BADGE[o.estado]||"")+'">'+esc(o.estado)+'</span>'+
    '<div class="o-who"><b>'+esc(o.name+" "+o.last)+'</b><span>'+esc(o.city)+', '+esc(o.dept)+'</span><span class="num">'+esc(o.phone)+'</span></div></button>'+
    '<div class="o-items">'+(o.items||[]).map(itemHtml).join('')+'</div>'+
    (ships>1?'<div class="warn"><b>'+ships+' envíos.</b> Crea un pedido aparte en el proveedor por cada producto, salvo que salgan de la misma bodega.</div>':'')+
    '<div class="money"><div class="now"><span>Paga ahora</span><b class="num">'+cop(o.now)+'</b></div><div><span>Al recibir</span><b class="num">'+cop(o.later)+'</b></div><div><span>'+(full?'Pago total':'Envío antes')+'</span><b class="num">'+(o.disc?'−'+cop(o.disc):cop(o.ship))+'</b></div></div>';
  if(open){
    h+='<div class="o-body"><dl class="kv"><dt>Dirección</dt><dd>'+esc(o.addr)+(o.barrio?' · Barrio '+esc(o.barrio):'')+'</dd><dt>Municipio</dt><dd>'+esc(o.city)+', '+esc(o.dept)+'</dd><dt>Celular</dt><dd class="num">'+esc(o.phone)+'</dd>'+(o.email?'<dt>Correo</dt><dd>'+esc(o.email)+'</dd>':'')+
      '<dt>Forma de pago</dt><dd>'+esc(o.pago)+'</dd><dt>Productos</dt><dd class="num">'+cop(o.sub)+(o.disc?' (descuento −'+cop(o.disc)+')':'')+'</dd><dt>Envío estimado</dt><dd class="num">'+cop(o.ship)+'</dd>'+
      (o.carrier&&o.carrier.indexOf("Me da igual")!==0?'<dt>Transportadora</dt><dd>'+esc(o.carrier)+'</dd>':'')+(o.notes?'<dt>Indicaciones</dt><dd>'+esc(o.notes)+'</dd>':'')+'</dl>'+
      '<div class="acts"><a class="btn wa" href="https://wa.me/'+waPhone(o.phone)+'?text='+encodeURIComponent("¡Hola "+o.name+"! Te escribimos de TODDO por tu pedido N.° "+o.code+".")+'" target="_blank" rel="noopener">'+I.wa+'Escribir al cliente</a>'+
      '<button class="btn ghost" data-copy="'+esc(o.code)+'">'+I.copy+'Copiar datos de envío</button></div>'+
      '<div class="edit"><div class="field"><label for="e-'+esc(o.code)+'">Estado</label><select id="e-'+esc(o.code)+'" data-state="'+esc(o.code)+'">'+STATES.map(function(s){ return '<option'+(s===o.estado?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'+
      '<div class="field"><label for="g-'+esc(o.code)+'">N.° de guía</label><input id="g-'+esc(o.code)+'" value="'+esc(o.guia)+'" placeholder="Opcional"></div>'+
      '<div class="field full"><label for="n-'+esc(o.code)+'">Notas internas (solo tú las ves)</label><textarea id="n-'+esc(o.code)+'" placeholder="Ej.: pagó por Nequi a las 3 p. m.">'+esc(o.nota)+'</textarea></div>'+
      '<div class="acts"><button class="btn" data-save="'+esc(o.code)+'">Guardar guía y notas</button></div>'+guideHtml(o)+'</div></div>';
  }
  return h+'</article>';
}

function driveId(u){ var m=String(u||"").match(/\/d\/([^/]+)/); return m?m[1]:""; }
function guideHtml(o){
  var c=o.code, busy=st.busy[c], pv=st.prev[c] || (driveId(o.foto)?"https://drive.google.com/thumbnail?id="+driveId(o.foto)+"&sz=w400":"");
  var canShare=!!(st.files[c] && navigator.canShare && navigator.canShare({files:[st.files[c]]}));
  return '<div class="guide"><div class="guide-ph">'+(pv?'<img src="'+esc(pv)+'" alt="Foto de la guía '+esc(c)+'">':I.cam)+'</div>'+
    '<div class="guide-b"><b>Foto de la guía</b><small>'+(busy?'Subiendo foto…':(o.foto?'Guardada en tu Drive, carpeta “Guías TODDO”.':'Toma o elige la foto de la guía de envío.'))+'</small>'+
    '<div class="acts"><label class="btn ghost upl">'+I.cam+(o.foto?'Cambiar foto':'Subir foto')+'<input type="file" accept="image/*" data-photo="'+esc(c)+'"'+(busy?' disabled':'')+'></label>'+
    (o.foto?'<a class="btn ghost" href="'+esc(o.foto)+'" target="_blank" rel="noopener">Ver foto</a>':'')+'</div></div>'+
    '<div class="send"><p>Envía al cliente su número de guía y la foto. Al enviarla, el pedido pasa a <b>Enviado</b>.</p><div class="acts">'+
    '<button class="btn wa" data-sendguide="'+esc(c)+'"'+(busy?' disabled':'')+'>'+I.wa+'Enviar guía al cliente</button>'+
    (canShare?'<button class="btn ghost" data-shareguide="'+esc(c)+'">'+I.share+'Compartir foto + mensaje</button>':'')+
    '</div>'+(canShare?'<p>“Enviar guía” abre el chat del cliente con el enlace a la foto. “Compartir foto” manda la foto misma con el mensaje; ahí eliges el chat del cliente.</p>':'')+'</div></div>';
}
function guideMsg(o, withLink){
  var t="¡Hola "+o.name+"! 🚚 Tu pedido N.° "+o.code+" de TODDO ya fue despachado.";
  if(o.guia) t+="\n\n*Número de guía:* "+o.guia;
  if(withLink && o.foto) t+="\n*Foto de la guía:* "+o.foto;
  t+="\n\nCon el número de guía puedes rastrear tu envío en la página de la transportadora.";
  if(String(o.pago||"").indexOf("total")<0 && Number(o.later)>0) t+=" Recuerda tener listos "+cop(o.later)+" para pagar al recibir.";
  return t+"\n\n¡Gracias por tu compra!";
}
function markSent(o){
  var i=STATES.indexOf(o.estado);
  if(i>-1 && i<STATES.indexOf("Enviado")) update(o.code,{estado:"Enviado"},"Pedido marcado como Enviado");
}
function syncGuia(c){
  var g=document.getElementById("g-"+c), n=document.getElementById("n-"+c), o=byCode(c), patch={}; if(!o) return;
  if(g && g.value.trim()!==(o.guia||"")) patch.guia=o.guia=g.value.trim();
  if(n && n.value.trim()!==(o.nota||"")) patch.nota=o.nota=n.value.trim();
  if(Object.keys(patch).length){ patch.action="update"; patch.code=c; api(patch).catch(function(){}); }
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1600, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error("blob")); },"image/jpeg",0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src=url;
  });
}
function uploadPhoto(c,file){
  var o=byCode(c); if(!o) return;
  syncGuia(c); st.busy[c]=true; mainView();
  compress(file).then(function(blob){
    st.files[c]=new File([blob],"guia-"+c+".jpg",{type:"image/jpeg"});
    st.prev[c]=URL.createObjectURL(blob); mainView();
    return new Promise(function(res){ var fr=new FileReader(); fr.onload=function(){ res(String(fr.result).split(",")[1]); }; fr.readAsDataURL(blob); });
  }).then(function(b64){
    return api({action:"photo",code:c,mime:"image/jpeg",data:b64});
  }).then(function(r){
    st.busy[c]=false;
    if(r.ok){ o.foto=r.url; toast("Foto guardada"); }
    else if(r.error==="clave"){ st.key=""; lsSet(KEY_STORE,""); st.err="Tu sesión se cerró. Entra de nuevo."; loginView(); return; }
    else { delete st.files[c]; delete st.prev[c]; toast("No se pudo guardar la foto"); }
    mainView();
  }).catch(function(){ st.busy[c]=false; delete st.files[c]; delete st.prev[c]; mainView(); toast("No se pudo subir la foto. Revisa tu internet."); });
}
function copyText(o){
  var full=String(o.pago||"").indexOf("total")>-1;
  var t="Pedido "+o.code+"\nNombres: "+o.name+"\nApellidos: "+o.last+"\nCelular: "+o.phone+(o.email?"\nCorreo: "+o.email:"")+"\nDepartamento: "+o.dept+"\nCiudad: "+o.city+"\nDirección: "+o.addr+(o.barrio?"\nBarrio: "+o.barrio:"")+(o.notes?"\nIndicaciones: "+o.notes:"")+"\n";
  (o.items||[]).forEach(function(i){ t+="\n"+i.qty+" x "+i.code+" "+i.name+(i.opt?" ("+i.opt+")":"")+" · cobrar al recibir: "+(full?"$0 (pagado)":cop((Number(i.price)||0)*(Number(i.qty)||1))); });
  return t;
}
function doCopy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast("Datos copiados"); },function(){ toast("No se pudo copiar"); }); }
  else toast("No se pudo copiar");
}
function byCode(c){ return st.orders.filter(function(o){return o.code===c;})[0]; }

function update(code, patch, okMsg){
  var o=byCode(code), prev={}; if(!o) return;
  Object.keys(patch).forEach(function(k){ prev[k]=o[k]; o[k]=patch[k]; });
  mainView();
  var body={action:"update",code:code}; Object.keys(patch).forEach(function(k){ body[k]=patch[k]; });
  api(body).then(function(r){
    if(r.ok){ toast(okMsg); return; }
    Object.keys(prev).forEach(function(k){ o[k]=prev[k]; }); mainView();
    if(r.error==="clave"){ st.key=""; lsSet(KEY_STORE,""); st.err="Tu sesión se cerró. Entra de nuevo."; loginView(); } else toast("No se pudo guardar");
  }).catch(function(){ Object.keys(prev).forEach(function(k){ o[k]=prev[k]; }); mainView(); toast("Sin conexión: no se guardó"); });
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-filter],[data-toggle],[data-copy],[data-save],[data-sendguide],[data-shareguide]"); if(!t) return;
  if(t.dataset.act==="refresh"){ load(); }
  else if(t.dataset.act==="logout"){ st.key=""; st.orders=[]; st.err=""; lsSet(KEY_STORE,""); loginView(); }
  else if(t.dataset.filter){ st.filter=t.dataset.filter; mainView(); }
  else if(t.dataset.toggle){ var c=t.dataset.toggle; st.open[c]=!st.open[c]; mainView(); }
  else if(t.dataset.copy){ var o=byCode(t.dataset.copy); if(o) doCopy(copyText(o)); }
  else if(t.dataset.sendguide){
    var c1=t.dataset.sendguide; syncGuia(c1); var o1=byCode(c1);
    if(!o1.guia && !o1.foto){ toast("Escribe el número de guía o sube la foto primero"); return; }
    window.open("https://wa.me/"+waPhone(o1.phone)+"?text="+encodeURIComponent(guideMsg(o1,true)),"_blank","noopener");
    markSent(o1);
  }
  else if(t.dataset.shareguide){
    var c2=t.dataset.shareguide; syncGuia(c2); var o2=byCode(c2), f=st.files[c2];
    if(!f) return;
    navigator.share({files:[f], text:guideMsg(o2,false)}).then(function(){ markSent(o2); }).catch(function(){});
  }
  else if(t.dataset.save){ var s=t.dataset.save; update(s,{guia:document.getElementById("g-"+s).value.trim(),nota:document.getElementById("n-"+s).value.trim()},"Guardado"); }
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){ uploadPhoto(t.dataset.photo,t.files[0]); return; }
  if(t.dataset&&t.dataset.state){ update(t.dataset.state,{estado:t.value},"Estado actualizado"); }
});
app.addEventListener("input",function(e){ if(e.target.id==="q"){ st.q=e.target.value.trim(); mainView(); } });
document.addEventListener("visibilitychange",function(){ if(!document.hidden && st.key && st.orders.length) load(); });

/* ---------- start ---------- */
fetch("tienda.json",{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
  var s=d.settings||{}; st.url=s.ordersUrl||"";
  if(d.brand){ st.logo=d.brand.logo||st.logo; st.logoL=d.brand.logoLight||st.logoL; }
  (d.products||[]).forEach(function(p){ st.products[p.id]=p; });
}).catch(function(){}).then(function(){
  st.key=lsGet(KEY_STORE);
  if(st.url && st.key){ app.innerHTML='<div class="login gut"><div class="card">'+logoImg(34)+'<p>Cargando pedidos…</p></div></div>'; load(); }
  else loginView();
});
})();
</script>
