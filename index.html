<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:type" content="website">
<meta property="og:title" content="TODDO · Productos virales y útiles">
<meta property="og:description" content="Paga cuando recibas. Envíos a toda Colombia.">
<meta property="og:url" content="https://toddo22a.github.io/">
<meta property="og:image" content="https://toddo22a.github.io/img/banner-1.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/icono.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TODDO Tienda</title>
<meta name="description" content="TODDO: productos virales y útiles con envíos a toda Colombia.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style id="toddo-style">
/* Layout: black storefront — glass header with logo, banner carousel as hero, yellow-icon trust strip, category rail, dark product cards with yellow prices, security band, footer; cart as side drawer, admin as full sheet. Single dark theme by brand choice. */
:root{
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --line:#2a2a2a; --line-2:#3a3a3a;
  --fg:#f6f6f4; --muted:#a3a3a0; --y:#fdba09; --y-2:#ffd34d; --y-ink:#111111; --y-glow:rgba(253,186,9,.35);
  --ok:#29c46a; --wa:#25d366; --danger:#ff5d52; --warn:#ffb057;
  --f-display:"Poppins","Arial Black",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --y-fg:#fdba09; --head-bg:rgba(10,10,10,.86); --ph1:#242424; --ph2:#121212; --hot-bg:#111111;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f1efe8; --line:#e4e1d8; --line-2:#d3cfc3;
  --fg:#111111; --muted:#5f5d57; --y-fg:#946500; --y-glow:rgba(253,186,9,.45); --ok:#16884a; --danger:#d23a2f; --warn:#b4600b;
  --head-bg:rgba(246,245,241,.88); --ph1:#ffffff; --ph2:#efece4; --hot-bg:#fff7dc; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f1efe8; --line:#e4e1d8; --line-2:#d3cfc3;
  --fg:#111111; --muted:#5f5d57; --y-fg:#946500; --y-glow:rgba(253,186,9,.45); --ok:#16884a; --danger:#d23a2f; --warn:#b4600b;
  --head-bg:rgba(246,245,241,.88); --ph1:#ffffff; --ph2:#efece4; --hot-bg:#fff7dc; color-scheme:light}
img.logo-l,.brand img.logo-l{display:none}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) img.logo-d{display:none}:root:not([data-theme="dark"]) img.logo-l{display:block}}
:root[data-theme="light"] img.logo-d{display:none}:root[data-theme="light"] img.logo-l{display:block}
.theme-btn svg{display:block}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.y{color:var(--y-fg)}

/* announcement */
.strip{background:var(--y);color:var(--y-ink);font-weight:700;font-size:13px;text-align:center;padding-block:7px;letter-spacing:.01em}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:30px;width:auto}
.brand img.logo-d{display:block}
.desk-search{flex:1;display:flex;justify-content:center;min-width:0}
.brand .txt{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.search{flex:1 1 auto;min-width:0;position:relative;max-width:520px}
.search input{width:100%;border:1px solid var(--line-2);border-radius:999px;padding:10px 16px 10px 42px;background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--y);outline:none;box-shadow:0 0 0 3px var(--y-glow)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top-actions{display:flex;gap:8px;margin-left:auto;flex:none}
.ibtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.ibtn:hover{border-color:var(--y)}
.ibtn.cart{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.ibtn .count{background:var(--y-ink);color:var(--y);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px;font-weight:700}
.msearch{display:none;padding-block:0 12px}

/* hero carousel */
.hero{padding-block:20px 8px}
.carousel{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:3/2;max-width:100%;max-height:560px;width:100%}
@media (min-width:900px){.carousel{aspect-ratio:auto;height:min(52vw,540px)}}
.slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.6,.05,.25,1)}
.slide{flex:0 0 100%;height:100%;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.slide .fallback{height:100%;display:grid;place-content:center;gap:10px;padding:24px;text-align:left;background:radial-gradient(60% 80% at 75% 50%,rgba(253,186,9,.25),transparent 70%),#050505}
.slide .fallback h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,62px);line-height:1.02;margin:0;letter-spacing:-.02em}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
.cbtn:hover{border-color:var(--y);color:var(--y)}
.cbtn.prev{left:14px}.cbtn.next{right:14px}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;z-index:2}
.dots button{width:9px;height:9px;border-radius:999px;border:0;background:rgba(255,255,255,.35);padding:0;transition:width .3s}
.dots button[aria-current="true"]{width:28px;background:var(--y)}

/* trust strip */
.trust-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:14px 8px}
.ts{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ts svg{flex:none;color:var(--y-fg)}
.ts b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.ts span{font-size:13px;color:var(--muted)}

/* section heads + chips */
.sec{padding-block:30px 6px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--y-fg)}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.4vw,34px);margin:2px 0 0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.rule{width:56px;height:4px;border-radius:4px;background:var(--y);margin-top:10px}
.sec-head select{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--fg)}
.chip:hover{border-color:var(--y)}
.chip[aria-pressed="true"]{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.chip small{opacity:.6;margin-left:5px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.subnav{border-top:1px solid var(--line)}
.subnav-in{display:flex;gap:6px;align-items:center;padding-block:6px;overflow:visible;flex-wrap:wrap}
.sn-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--fg);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px}
.sn-btn:hover,.sn-btn[aria-expanded="true"]{background:var(--surface)}
.sn-btn[aria-pressed="true"]{color:var(--y-fg)}
.sn-btn svg{color:var(--y-fg)}
.sn-count{background:var(--y);color:var(--y-ink);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:800}
.menu-wrap{position:relative}
.catmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:45;min-width:250px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;background:#1c1c1c;color:#f6f6f4;border:1px solid var(--line-2);border-radius:14px;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:grid}
.catmenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;background:transparent;border:0;color:inherit;text-align:left;padding:11px 14px;border-radius:10px;font-size:15px}
.catmenu button:hover,.catmenu button:focus-visible{background:rgba(253,186,9,.16);color:#fdba09}
.catmenu small{opacity:.55;font-size:12px}
.card-wrap{position:relative;display:flex;min-width:0}
.card-wrap .card{flex:1;width:100%}
.fav{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.92);color:#b9b9b4;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fav svg path{fill:transparent;stroke:#8d8d88}
.fav:hover svg path{stroke:#fdba09}
.fav.on svg path{fill:#fdba09;stroke:#d99a00}
.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.faq details[open]{border-color:var(--y)}
.faq summary{cursor:pointer;list-style:none;padding:15px 28px 15px 0;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:22px;color:var(--y-fg);font-weight:700}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 16px;color:var(--muted)}
.socials{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.socials a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:13px}
.socials a:hover{border-color:var(--y);color:var(--y-fg)}
.socials svg{color:#1877f2}
.flink{background:none;border:0;padding:0;color:var(--muted);text-align:left;font-size:14px}
.flink:hover{color:var(--y-fg);text-decoration:underline}
.page-modal{display:block;width:min(720px,100%)}
.page-in{padding:22px;display:grid;gap:16px}
.page-in h3{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0}
.page-in h4{margin:0 0 4px;font-size:16px}
.page-in p{margin:0;color:var(--muted)}
.pay{border:1px solid var(--line-2);border-radius:14px;padding:12px;display:grid;gap:10px;margin:0}
.pay legend{font-weight:700;font-size:14px;padding:0 6px}
.pay-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.pay-opt.on{border-color:var(--y);background:rgba(253,186,9,.10)}
.pay-opt input{accent-color:var(--y);margin-top:3px;width:18px;height:18px;flex:none}
.pay-opt b{display:block;font-size:14px}
.pay-opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pay-badge{font-style:normal;background:var(--y);color:var(--y-ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;margin-left:4px;white-space:nowrap}
.pay-split{display:grid;gap:4px;border-top:1px dashed var(--line-2);padding-top:8px}
.tot.disc span:last-child{color:var(--ok);font-weight:700}
.ship-note{display:flex;gap:12px;align-items:flex-start;background:rgba(253,186,9,.14);border:1px solid rgba(253,186,9,.55);border-radius:12px;padding:12px 14px}
.ship-note svg{flex:none;color:var(--y-fg);margin-top:1px}
.ship-note b{display:block;font-size:14px;color:var(--fg)}
.ship-note span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.quote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;background:var(--surface);border:1px solid var(--y);border-radius:24px;padding:28px;box-shadow:0 18px 50px -30px var(--y-glow)}
.quote-txt{display:grid;gap:10px;align-content:start}
.quote-txt h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.quote-txt p{margin:0;color:var(--muted)}
.quote-steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.quote-steps li{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.quote-steps svg{color:var(--y-fg);flex:none}
.quote-form{display:grid;gap:12px;align-content:start}
.quote-form textarea{min-height:76px}
@media (max-width:860px){.quote{grid-template-columns:1fr;padding:20px}}
.quick{position:absolute;right:12px;bottom:12px;z-index:3;width:40px;height:40px;border-radius:12px;border:0;background:var(--y);color:var(--y-ink);display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--y-glow)}
.quick:hover{background:var(--y-2);transform:scale(1.06)}
.card-wrap .card-body{padding-right:58px}
.cta{display:grid;gap:10px;position:sticky;bottom:0;background:var(--surface);padding:10px 0;margin:-10px 0;z-index:2}
.cta .btn{font-size:16px;padding:15px 18px}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cat-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;display:grid;gap:4px;justify-items:center;text-align:center;color:var(--fg)}
.cat-tile:hover{border-color:var(--y);transform:translateY(-2px)}
.ct-img{width:84px;height:84px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:2px solid var(--y);display:block;margin-bottom:4px}
.ct-img img{width:100%;height:100%;object-fit:cover;display:block}
.ct-name{font-weight:700;font-size:14px;line-height:1.2}
.ct-n{font-size:12px;color:var(--muted)}
.toast-cart{display:flex;align-items:center;gap:14px;font-weight:600}
.toast-cart svg{vertical-align:-3px}
.toast-cart button{border:0;background:var(--y-ink);color:var(--y);border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
@media (max-width:460px){.cat-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ct-img{width:64px;height:64px}.ct-name{font-size:12px}.quick{width:36px;height:36px;right:8px;bottom:8px}.card-wrap .card-body{padding-right:48px}}
@media (prefers-reduced-motion:reduce){.quick:hover,.cat-tile:hover{transform:none}}
.share{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.share-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none}
.share-btn:hover{border-color:var(--y)}
.share-btn svg{color:var(--wa)}
.related{grid-column:1/-1;border-top:1px solid var(--line);padding:16px 20px 20px}
.related h4{margin:0 0 12px;font-family:var(--f-display);font-size:17px}
.rel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 0 10px;display:grid;gap:4px;text-align:left;overflow:hidden;color:var(--fg)}
.rel:hover{border-color:var(--y)}
.rel .ph{border-radius:0}.rel .ph .glyph{font-size:30px}
.rel-n{font-size:13px;font-weight:600;line-height:1.25;padding:4px 10px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel .price{padding:0 10px}
@media (max-width:860px){.rel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.related{padding:14px 16px 18px}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,260px);gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative;color:var(--fg)}
.card:hover{border-color:var(--y);box-shadow:0 10px 40px -18px var(--y-glow)}
.ph{aspect-ratio:1/1;width:100%;max-width:100%;background:radial-gradient(70% 70% at 50% 55%,var(--ph1),var(--ph2));display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.ph .glyph{font-family:var(--f-display);font-weight:800;font-size:64px;color:var(--y);opacity:.22}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.card-name{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--y-fg);letter-spacing:-.01em}
.old{color:var(--muted);text-decoration:line-through;font-size:13px}
.cod{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cod::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--ok)}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{background:var(--y);color:var(--y-ink);font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px}
.badge.demo{background:#fff;color:#111}
.badge.out{background:var(--line-2);color:var(--fg)}
.badge.hot{background:var(--hot-bg);color:var(--y-fg);border:1px solid var(--y)}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted)}

/* security band */
.band{margin-top:44px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center}
.band img{width:100%;height:100%;object-fit:cover;display:block;max-height:340px}
.band-txt{padding:28px;display:grid;gap:14px}
.band-txt h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.08;margin:0;letter-spacing:-.02em}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;counter-increment:s;color:var(--muted)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:999px;background:var(--y);color:var(--y-ink);font-weight:800;display:grid;place-items:center;font-family:var(--f-display)}
.steps b{color:var(--fg);display:block}

/* overlays */

.x{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;width:38px;height:38px;font-size:18px;flex:none;color:var(--fg)}

.tot .price{font-size:24px}

.ship-box{display:grid;gap:8px}
.osum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.osum-h{display:flex;justify-content:space-between;align-items:center}
.osum-edit{background:none;border:0;color:var(--y-fg);font-weight:600;padding:0;text-decoration:underline}
.osum-l{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}

.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--y);color:var(--y-ink);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}

.btn.wa{background:var(--wa);color:#04200f}
.btn.wa:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--y)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}

/* product modal */
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(940px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.gal{padding:14px;display:grid;gap:10px;align-content:start}
.gal .ph{border-radius:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:60px;height:60px;padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.thumbs button[aria-pressed="true"]{border-color:var(--y)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:22px 22px 22px 8px;display:flex;flex-direction:column;gap:14px;min-width:0}
.info h3{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
.info .price{font-size:32px}
.save{background:rgba(253,186,9,.12);color:var(--y-fg);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700}
.desc{white-space:pre-line;color:var(--muted)}
.trust{display:grid;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}

.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--y);outline:none}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px}
.err .ok{color:var(--ok)}

/* floating whatsapp */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:999px;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);color:#fff}

.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.prow .ph{border-radius:8px}
.prow .ph .glyph{font-size:20px}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--fg)}
.acts button:disabled{opacity:.35}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pic{width:72px;height:72px;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2)}
.pic.wide{width:120px;height:80px}
.pic img{width:100%;height:100%;object-fit:cover}
.pic button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:1}
.addpic{width:72px;height:72px;border:2px dashed var(--line-2);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
.addpic.wide{width:120px;height:80px}
.addpic:hover{border-color:var(--y);color:var(--y)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--y);width:18px;height:18px}
.calc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.calc .res{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--y);color:var(--y-ink);padding:12px 18px;border-radius:14px;z-index:90;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
footer{border-top:1px solid var(--line);margin-top:56px;padding-block:34px 90px;color:var(--muted);font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
footer img{height:28px;width:auto}
footer h5{color:var(--fg);font-family:var(--f-display);font-size:14px;margin:0 0 8px}
footer p{margin:8px 0 0;max-width:40ch}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}

@media (max-width:860px){
  .trust-strip{grid-template-columns:1fr;gap:8px}
  .ts{padding:12px 14px}
  .modal{grid-template-columns:1fr}
  .info{padding:4px 16px 20px}
  .admin-grid{grid-template-columns:1fr}
  .band{grid-template-columns:1fr}
  .band img{max-height:240px}

  .desk-search{display:none}

}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row2{grid-template-columns:1fr}.price{font-size:17px}.card-body{padding:10px}.brand img{height:26px}.carousel{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s,box-shadow .2s,transform .2s}.card:hover{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.slides{transition:none}html{scroll-behavior:auto}}

<script id="toddo-app">
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("store-data").textContent);
var S = DATA.settings, P = DATA.products, B = DATA.brand || {banners:[]};
var DEPTS = ["Amazonas","Antioquia","Arauca","Atlántico","Bogotá D.C.","Bolívar","Boyacá","Caldas","Caquetá","Casanare","Cauca","Cesar","Chocó","Córdoba","Cundinamarca","Guainía","Guaviare","Huila","La Guajira","Magdalena","Meta","Nariño","Norte de Santander","Putumayo","Quindío","Risaralda","San Andrés y Providencia","Santander","Sucre","Tolima","Valle del Cauca","Vaupés","Vichada"];
var CAPITALS = {"Amazonas":"Leticia","Antioquia":"Medellín","Arauca":"Arauca","Atlántico":"Barranquilla","Bogotá D.C.":"Bogotá","Bolívar":"Cartagena","Boyacá":"Tunja","Caldas":"Manizales","Caquetá":"Florencia","Casanare":"Yopal","Cauca":"Popayán","Cesar":"Valledupar","Chocó":"Quibdó","Córdoba":"Montería","Cundinamarca":"Soacha","Guainía":"Inírida","Guaviare":"San José del Guaviare","Huila":"Neiva","La Guajira":"Riohacha","Magdalena":"Santa Marta","Meta":"Villavicencio","Nariño":"Pasto","Norte de Santander":"Cúcuta","Putumayo":"Mocoa","Quindío":"Armenia","Risaralda":"Pereira","San Andrés y Providencia":"San Andrés","Santander":"Bucaramanga","Sucre":"Sincelejo","Tolima":"Ibagué","Valle del Cauca":"Cali","Vaupés":"Mitú","Vichada":"Puerto Carreño"};
var REMOTE = ["Amazonas","Guainía","Guaviare","Vaupés","Vichada","San Andrés y Providencia","Putumayo","Chocó","Caquetá","Arauca"];
var EXTRA_CITIES = {"Atlántico":["soledad","malambo","puerto colombia"],"Antioquia":["bello","envigado","itagui","sabaneta"],"Valle del Cauca":["palmira","jamundi","yumbo"],"Santander":["floridablanca","giron","piedecuesta"],"Risaralda":["dosquebradas"],"Cundinamarca":["soacha","chia","zipaquira","facatativa","fusagasuga","mosquera","madrid","funza","cajica"],"Bolívar":["turbaco"]};
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); }
var REGION = {"Atlántico":"caribe","Bolívar":"caribe","Magdalena":"caribe","Cesar":"caribe","La Guajira":"caribe","Córdoba":"caribe","Sucre":"caribe",
 "Bogotá D.C.":"centro","Cundinamarca":"centro","Boyacá":"centro","Tolima":"centro","Huila":"centro","Meta":"centro","Casanare":"centro",
 "Antioquia":"antioquia","Caldas":"antioquia","Risaralda":"antioquia","Quindío":"antioquia",
 "Santander":"santanderes","Norte de Santander":"santanderes",
 "Valle del Cauca":"pacifico","Cauca":"pacifico","Nariño":"pacifico"};
function isMainCity(dept, city){ var c=norm(city), cap=norm(CAPITALS[dept]); return dept==="Bogotá D.C." || c===cap || (cap && c.indexOf(cap+" ")===0) || (EXTRA_CITIES[dept]||[]).indexOf(c)>-1; }
// Each product ships from its supplier's warehouse (p.origin = department) with its own rates (p.ship = {local, regional, nacional}).
function lineShip(p, dept, city){
  var sh=S.shipping||{}, r=p.ship||{}, o=p.origin||sh.defaultOrigin||"Bogotá D.C.";
  var local=r.local||sh.local||16000, regional=r.regional||sh.regional||18000, nacional=r.nacional||sh.nacional||20000;
  var v = (o===dept) ? local : (REGION[o] && REGION[o]===REGION[dept]) ? regional : nacional;
  if(!isMainCity(dept, city)) v += (sh.municipioExtra||4000);
  return v;
}
function shipQuote(dept, city){
  if(!dept) return {state:"pending"};
  if(REMOTE.indexOf(dept)>-1) return {state:"confirm"};
  if(!city) return {state:"pending"};
  var lines=cartLines(), total=0;
  lines.forEach(function(x){ total+=lineShip(x.p, dept, city); });
  return {state:"ok", value: total, lines: lines.length||1};
}
var MUN=null;
function loadMun(){ if(MUN||!window.fetch) return; fetch("municipios.json").then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){ MUN=j; var f=document.getElementById("c-city-wrap"); if(f) f.outerHTML=cityField(); }).catch(function(){}); }
function cityField(){
  var list = MUN && customer.dept ? (MUN[customer.dept]||[]) : null;
  if(list && list.length){
    if(list.indexOf(customer.city)<0) customer.city = list.length===1 ? list[0] : "";
    return '<div class="field" id="c-city-wrap"><label for="c-city">Municipio</label><select id="c-city"><option value="">Elige tu municipio…</option>'+list.map(function(c){return '<option'+(customer.city===c?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>';
  }
  if(MUN && !customer.dept) return '<div class="field" id="c-city-wrap"><label for="c-city">Municipio</label><select id="c-city" disabled><option value="">Primero elige el departamento</option></select></div>';
  return '<div class="field" id="c-city-wrap"><label for="c-city">Ciudad o municipio</label><input id="c-city" type="text" autocomplete="address-level2" value="'+esc(customer.city||"")+'"></div>';
}
function orderSumHtml(){
  var q=shipQuote(customer.dept, customer.city), lines=cartLines();
  return '<div class="osum" id="order-sum"><div class="osum-h"><b>Tu pedido</b><button class="admin-link osum-edit" data-act="back">Editar</button></div>'+lines.map(function(x){
    var sh = q.state==="ok" ? lineShip(x.p, customer.dept, customer.city) : null;
    return '<div class="osum-l">'+photo(x.p)+'<div class="osum-t"><div class="osum-n">'+esc(lineName(x))+'</div><div class="small num">'+x.c.qty+' × '+cop(x.p.price)+(sh!==null?' · envío '+cop(sh):'')+'</div></div><div class="num osum-p">'+cop(x.p.price*x.c.qty)+'</div></div>';
  }).join('')+'</div>';
}
function refreshCheckout(){ var sb=document.getElementById("ship-box"); if(sb) sb.outerHTML=shipSummaryHtml(); var os=document.getElementById("order-sum"); if(os) os.outerHTML=orderSumHtml(); }
function payMode(){ return customer.pay==="full"?"full":"envio"; }
function discPct(){ var d=Number(S.prepayDiscount); return isNaN(d)?5:d; }
function payCalc(){
  var q=shipQuote(customer.dept, customer.city), sub=cartTotal(), mode=payMode();
  var ship = q.state==="ok" ? q.value : null;
  var disc = mode==="full" ? Math.round(sub*discPct()/100/100)*100 : 0;
  var prod = sub-disc;
  var now = mode==="full" ? (ship!==null? prod+ship : null) : ship;
  var later = mode==="full" ? 0 : prod;
  return {q:q, sub:sub, ship:ship, disc:disc, prod:prod, now:now, later:later, mode:mode};
}
function payChoiceHtml(){
  var m=payMode();
  return '<fieldset class="pay" id="pay-box"><legend>¿Cómo quieres pagar?</legend>'+
    '<label class="pay-opt'+(m==="envio"?' on':'')+'"><input type="radio" name="pay" value="envio"'+(m==="envio"?' checked':'')+'><span><b>Pago del envío por adelantado</b><small>Pagas solo el envío ahora y el producto cuando lo recibas.</small></span></label>'+
    '<label class="pay-opt'+(m==="full"?' on':'')+'"><input type="radio" name="pay" value="full"'+(m==="full"?' checked':'')+'><span><b>Pago total por adelantado <em class="pay-badge">'+discPct()+'% de descuento</em></b><small>Pagas todo ahora y te descontamos el '+discPct()+'% en los productos.</small></span></label>'+
    '<span class="small">Pagos por Nequi, Daviplata o transferencia Bancolombia. Te enviamos los datos de pago por WhatsApp al confirmar tu pedido.</span></fieldset>';
}
function shipSummaryHtml(){
  var c=payCalc(), q=c.q, h='<div class="ship-box" id="ship-box"><div class="tot sm"><span>Productos</span><span class="num">'+cop(c.sub)+'</span></div>';
  if(c.disc) h+='<div class="tot sm disc"><span>Descuento pago anticipado ('+discPct()+'%)</span><span class="num">− '+cop(c.disc)+'</span></div>';
  if(q.state==="ok") h+='<div class="tot sm"><span>Envío a '+esc(customer.city)+(q.lines>1?' ('+q.lines+' paquetes)':'')+'</span><span class="num">'+cop(c.ship)+'</span></div>';
  else if(q.state==="confirm") h+='<div class="tot sm"><span>Envío</span><span>Por confirmar</span></div>';
  else h+='<div class="tot sm"><span>Envío</span><span class="small">Elige departamento y municipio</span></div>';
  h+='<div class="pay-split"><div class="tot"><span>Pagas ahora</span><span class="price num">'+(c.now!==null?cop(c.now):(c.mode==="full"?cop(c.prod)+' + envío':'Valor del envío'))+'</span></div>'+

var CARRIERS = ["Me da igual, la que llegue más rápido","Interrapidísimo","Servientrega","Coordinadora","Envía","Domina","Veloces","99minutos","Otra (la escribo en indicaciones)"];

 ["¿Cómo pago mi pedido?","Tienes dos opciones: 1) Pagas solo el envío por adelantado y el producto cuando lo recibas, o 2) pagas todo por adelantado y te damos un descuento en los productos. Recibimos Nequi, Daviplata y transferencia Bancolombia; te enviamos los datos por WhatsApp al confirmar tu pedido."],

 "envios":["Política de envíos",[

function sendQuote(){
  var prod=document.getElementById("qt-prod").value.trim(), det=document.getElementById("qt-det").value.trim(), name=document.getElementById("qt-name").value.trim(), city=document.getElementById("qt-city").value.trim();
  ui.qtProd=prod; ui.qtDet=det;
  var err=document.getElementById("qt-err");
  if(!prod){ err.textContent="Escribe qué producto buscas."; return; }
  if(name){ customer.name=name; } if(city){ customer.city=city; } try{ localStorage.setItem("toddo-cliente", JSON.stringify(customer)); }catch(e){}
  var msg="¡Hola "+S.name+"! No encontré este producto en la tienda y quiero que me lo coticen:\n\n*Producto:* "+prod+(det?"\n*Detalles:* "+det:"")+(name?"\n*Nombre:* "+name:"")+(city?"\n*Ciudad:* "+city:"");
  if(!S.whatsapp){ err.textContent="Muy pronto habilitaremos esta opción."; return; }
  var a=document.createElement("a"); a.href=waUrl(msg); a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  err.innerHTML='<span class="ok">Abrimos WhatsApp con tu solicitud. Solo tienes que enviarla.</span>';
}

function relatedFor(p){
  var same=P.filter(function(x){return x.id!==p.id && x.available && x.category===p.category;});
  var other=P.filter(function(x){return x.id!==p.id && x.available && x.category!==p.category && x.featured;});
  var rest=P.filter(function(x){return x.id!==p.id && x.available && same.indexOf(x)<0 && other.indexOf(x)<0;});
  return same.concat(other,rest).slice(0,4);
}

var timer=null;
function goSlide(i){ var n=(B.banners||[]).length; if(n<2) return; ui.slide=(i+n)%n; var s=document.getElementById("slides"); if(s) s.style.transform="translateX(-"+(ui.slide*100)+"%)"; document.querySelectorAll(".dots button").forEach(function(b,k){ b.setAttribute("aria-current", String(k===ui.slide)); }); }

var tx=null;
document.addEventListener("touchstart",function(e){ if(e.target.closest(".carousel")) tx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",function(e){ if(tx===null) return; var dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>40){ goSlide(ui.slide+(dx<0?1:-1)); startAuto(); } });

var overlay = document.createElement("div"); overlay.id="overlays"; document.body.appendChild(overlay);
function renderOverlays(){
  var h='';
  if(ui.view){ var p=byId(ui.view); if(p) h+=productModal(p); }
  if(ui.page && POLICIES[ui.page]) h+=policyHtml(ui.page);
  if(ui.cartOpen) h+=cartDrawer();
  if(ui.admin && draft) h+=adminHtml();
  overlay.innerHTML=h;
  document.documentElement.style.overflow = h ? "hidden" : "";
}

function addToCart(id, n, opt){ opt=opt||""; var c=cart.filter(function(x){return x.id===id && (x.opt||"")===opt;})[0]; if(c) c.qty+=n||1; else cart.push({id:id,qty:n||1,opt:opt}); cart=cart.filter(function(x){return x.qty>0;}); saveCart(); }
function lineName(x){ return x.p.name+(x.c.opt?" ("+(x.p.options?x.p.options.label+": ":"")+x.c.opt+")":""); }
function chosenOpt(p){ if(!p.options) return ""; var s=document.getElementById("p-opt"); return s?s.value:""; }
function orderText(){
  var lines=cartLines(), c=payCalc(), t="¡Hola "+S.name+"! Quiero hacer este pedido:\n\n";
  lines.forEach(function(x){ t+="• "+x.c.qty+" x "+lineName(x)+" — "+cop(x.p.price*x.c.qty)+"\n"; });
  t+="\nProductos: "+cop(c.sub);
  if(c.disc) t+="\nDescuento pago anticipado ("+discPct()+"%): -"+cop(c.disc);
  t+="\nEnvío estimado: "+(c.ship!==null?cop(c.ship):"por confirmar");
  t+="\n\n*Forma de pago:* "+(c.mode==="full"?"Pago total por adelantado ("+discPct()+"% de descuento)":"Pago del envío por adelantado");
  t+="\n*Pago ahora:* "+(c.now!==null?cop(c.now):(c.mode==="full"?cop(c.prod)+" + envío":"valor del envío"));
  t+="\n*Pago al recibir:* "+(c.mode==="full"?"$0":cop(c.later));
  t+="\n\nQuedo atento(a) a los datos de pago.";
  t+="\n\n*Datos de envío*\nNombres: "+customer.name+"\nApellidos: "+customer.last+"\nCelular: "+customer.phone+(customer.email?"\nCorreo: "+customer.email:"")+"\nDepartamento: "+customer.dept+"\nCiudad: "+customer.city+"\nDirección: "+customer.addr+(customer.barrio?"\nBarrio: "+customer.barrio:"")+(customer.carrier&&customer.carrier.indexOf("Me da igual")!==0?"\nTransportadora sugerida: "+customer.carrier:"")+(customer.notes?"\nIndicaciones: "+customer.notes:"");
  return t;
}
function readCustomer(){
  ["name","last","phone","email","dept","city","addr","barrio","carrier","notes"].forEach(function(k){ var el=document.getElementById("c-"+k); if(el) customer[k]=el.value.trim(); });
  try{ localStorage.setItem("toddo-cliente", JSON.stringify(customer)); }catch(e){}
}
function sendOrder(){
  readCustomer();
  var miss=[]; if(!customer.name) miss.push("nombres"); if(!customer.last) miss.push("apellidos"); if(customer.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(customer.email)) miss.push("un correo válido"); if(!/\d{7,}/.test((customer.phone||"").replace(/\D/g,""))) miss.push("celular"); if(!customer.dept) miss.push("departamento"); if(!customer.city) miss.push("ciudad"); if(!customer.addr) miss.push("dirección");
  var err=document.getElementById("c-err");
  if(miss.length){ err.textContent="Falta completar: "+miss.join(", ")+"."; return; }
  var text=orderText();
  if(!S.whatsapp){ err.textContent="La tienda aún no tiene WhatsApp configurado. Copiamos tu pedido para que lo envíes a la tienda."; copy(text); return; }
  var a=document.createElement("a"); a.href=waUrl(text); a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  err.innerHTML='<span class="ok">Abrimos WhatsApp con tu pedido.</span> Si no se abrió, <button class="admin-link" data-act="copy-order" style="background:none;border:0;color:var(--y-fg);text-decoration:underline;padding:0">copia el pedido</button> y envíalo al <span class="num" style="user-select:all">+'+esc(S.whatsapp)+'</span>.';
}
function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast("Pedido copiado"); }, function(){ toast("No se pudo copiar automáticamente"); }); }
  else toast("No se pudo copiar automáticamente");
}

    '<label class="check"><input id="e-av" type="checkbox"'+(p.available?' checked':'')+'> Disponible para la venta</label>'+
    '<label class="check"><input id="e-ft" type="checkbox"'+(p.featured?' checked':'')+'> Viral / destacado (aparece en “Productos virales”)</label>'+

    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="save-prod">Guardar producto</button><button class="btn ghost" data-act="cancel-edit">Cancelar</button>'+(ui.editId!=="new"?(ui.confirmDel?'<button class="btn danger" data-act="del-prod">Sí, borrar</button>':'<button class="btn danger" data-act="ask-del">Borrar</button>'):'')+'</div></div>';
}

function helpHtml(){
  return '<div class="panel"><h4>Cómo subir un producto de Dropi</h4><ol class="small" style="margin:0;padding-left:18px;display:grid;gap:6px">'+
    '<li>En Dropi, abre el producto y descarga sus fotos.</li><li>Pulsa “Nuevo producto”, sube las fotos y copia nombre y descripción.</li><li>Usa la calculadora para fijar tu precio y guarda.</li><li>Pulsa “Publicar cambios”: tus clientes ven la tienda actualizada.</li><li>Cuando llegue un pedido por WhatsApp, confírmalo con el cliente y créalo en Dropi.</li></ol></div>';

function num(id){ var el=document.getElementById(id); return el?Number(String(el.value).replace(/[^\d]/g,""))||0:0; }
function calcPrice(){
  var cost=num("k-cost"), ship=num("k-ship"), gain=num("k-gain"), dev=Math.min(60,num("k-dev"));
  var out=document.getElementById("k-out"); if(!out) return 0;
  if(!cost){ out.textContent="—"; return 0; }
  var raw=(cost+ship+gain)/(1-dev/100);
  var price=Math.ceil((raw+100)/1000)*1000-100;
  out.textContent=cop(price); return price;
}
function readEditor(p){
  p.name=document.getElementById("e-name").value.trim();
  p.category=document.getElementById("e-cat").value.trim();
  p.price=num("e-price"); p.oldPrice=num("e-old");
  p.desc=document.getElementById("e-desc").value.trim();
  p.available=document.getElementById("e-av").checked; p.featured=document.getElementById("e-ft").checked;
}
function currentEdit(){ return ui.editId==="new" ? ui._new : byId(ui.editId, draft.products); }
function compress(file, max, q){
  return new Promise(function(res,rej){
    var r=new FileReader(); r.onerror=rej;
    r.onload=function(){ var img=new Image(); img.onerror=function(){rej(new Error("img"));}; img.onload=function(){
      var w=img.width, h=img.height, k=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
      var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",q)); }; img.src=r.result; };
    r.readAsDataURL(file);
  });
}
var REG_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
function pageContent(data){
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  var keep=['title','meta[name="claude:viewport-fit-sides"]','meta[name="description"]','link[href*="fonts.googleapis"]'].map(function(sel){ var el=document.querySelector(sel); return el?el.outerHTML:""; }).join("\n");
  var st=document.getElementById("toddo-style"), js=document.getElementById("toddo-app");
  var S1="<"+"script", S2="</"+"script>";
  return keep+"\n"+'<style id="toddo-style">'+st.textContent+"</style>\n"+'<div id="app"></div>\n'+
    S1+' type="application/json" id="store-data">'+json+S2+"\n"+S1+' id="toddo-app">'+js.textContent+S2;
}
async function publish(){
  ui.saving=true; renderOverlays();
  try{
    var art = window.claude && window.claude.use ? await window.claude.use("artifact") : null;
    if(!art) throw {code:"unavailable"};
    var doc=REG_HEAD+pageContent(draft)+"</body></html>";
    if(doc.length>15.5*1024*1024) throw {code:"too_big"};
    await art.publish(doc);
    DATA=draft; S=DATA.settings; P=DATA.products; B=DATA.brand; ui.dirty=false; toast("Publicado. Tus clientes ya ven los cambios.");
  }catch(e){
    var c=e&&e.code;
    if(c==="conflict") toast("Se guardó otra versión primero; la tienda se está recargando.");
    else if(c==="not_writer"||c==="not_granted"){ toast("Esta vista es solo de lectura: no puedes publicar cambios."); ui.canEdit=false; }
    else if(c==="too_big") toast("La tienda superó el tamaño máximo. Quita algunas fotos e intenta de nuevo.");
    else if(c==="unavailable") toast("Publicar no está disponible aquí. Abre la tienda desde tu cuenta de Claude.");
    else toast("No se pudo publicar ("+(c||"error")+"). Intenta de nuevo en un momento.");
  }
  ui.saving=false; render();
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", function(ev){
  if(ui.catMenu && !ev.target.closest(".menu-wrap")){ ui.catMenu=false; render(); }
  var t=ev.target.closest("[data-quick],[data-fav],[data-page],[data-copy],[data-act],[data-cat],[data-view],[data-add],[data-buy],[data-inc],[data-dec],[data-img],[data-edit],[data-delpic],[data-delban],[data-up],[data-slide]");
  if(!t) return;
  if(t.classList.contains("scrim") && ev.target!==t) return;
  var a=t.dataset;
  if(a.fav){ toggleFav(a.fav); var keep=window.scrollY; render(); window.scrollTo(0,keep); toast(isFav(a.fav)?"Guardado en favoritos":"Quitado de favoritos"); return; }
  if(a.slide){ goSlide(Number(a.slide)); startAuto(); return; }
  if(a.cat){ ui.cat=a.cat; ui.catMenu=false; render(); var cat=document.getElementById("catalogo"); if(cat && a.cat!=="Todo") cat.scrollIntoView({block:"start"}); return; }
  if(a.view){ ui.view=a.view; ui.imgIdx=0; renderOverlays(); var md=document.querySelector(".modal"); if(md) md.scrollTop=0; return; }
  if(a.page){ ui.page=a.page; renderOverlays(); return; }
  if(a.copy){ var pp=byId(a.copy); if(pp){ var u=productUrl(pp); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(function(){toast("Enlace copiado");},function(){toast(u);}); } else toast(u); } return; }
  if(a.img){ ui.imgIdx=Number(a.img); renderOverlays(); return; }
  if(a.add){ var pa=byId(a.add); addToCart(a.add,1,chosenOpt(pa)); ui.view=null; render(); toastCart(pa?pa.name:""); return; }
  if(a.quick){ var pq=byId(a.quick); if(pq && pq.options){ ui.view=pq.id; ui.imgIdx=0; renderOverlays(); return; } addToCart(a.quick,1,""); render(); toastCart(pq?pq.name:""); return; }
  if(a.buy){ addToCart(a.buy,1,chosenOpt(byId(a.buy))); ui.view=null; ui.cartOpen=true; ui.checkout=true; loadMun(); render(); return; }
  if(a.inc!==undefined){ var ci=cart[Number(a.inc)]; if(ci){ ci.qty++; saveCart(); } render(); return; }
  if(a.dec!==undefined){ var cd=cart[Number(a.dec)]; if(cd){ cd.qty--; cart=cart.filter(function(x){return x.qty>0;}); saveCart(); } render(); return; }
  if(a.edit){ ui.editId=a.edit; ui.confirmDel=false; renderOverlays(); scrollEditor(); return; }
  if(a.delpic){ var pe=currentEdit(); readEditor(pe); pe.images.splice(Number(a.delpic),1); renderOverlays(); return; }
  if(a.delban){ draft.brand.banners.splice(Number(a.delban),1); ui.dirty=true; renderOverlays(); return; }
  if(a.up){ var i=Number(a.up); var arr=draft.products; var tmp=arr[i-1]; arr[i-1]=arr[i]; arr[i]=tmp; ui.dirty=true; renderOverlays(); return; }
  switch(a.act){
    case "home": ev.preventDefault(); ui.cat="Todo"; ui.q=""; render(); window.scrollTo(0,0); break;
    case "theme": setTheme(effTheme()==="light"?"dark":"light"); render(); break;
    case "go-quote": ui.catMenu=false; var qf=document.getElementById("cotiza"); if(!qf){ ui.qtProd=ui.q; render(); qf=document.getElementById("cotiza"); } if(qf){ qf.scrollIntoView({block:"start"}); var qi=document.getElementById("qt-prod"); if(qi){ if(ui.q && !qi.value) qi.value=ui.q; setTimeout(function(){ try{qi.focus({preventScroll:true});}catch(e){} },300); } } break;
    case "catmenu": ui.catMenu=!ui.catMenu; render(); break;
    case "go-viral": ui.cat="Todo"; ui.q=""; ui.catMenu=false; render(); var vv=document.getElementById("virales"); if(vv) vv.scrollIntoView({block:"start"}); break;
    case "prev": goSlide(ui.slide-1); startAuto(); break;
    case "next": goSlide(ui.slide+1); startAuto(); break;
    case "cart": ui.cartOpen=true; ui.checkout=false; renderOverlays(); break;
    case "close-cart": if(ui.checkout) readCustomer(); ui.cartOpen=false; ui.checkout=false; render(); break;
    case "close-view": ui.view=null; try{ if(location.hash.indexOf("#p-")===0) history.replaceState(null,"",location.pathname+location.search); }catch(e){} renderOverlays(); break;
    case "close-page": ui.page=null; renderOverlays(); break;
    case "go-faq": ui.cat="Todo"; ui.q=""; render(); var fq=document.getElementById("faq"); if(fq) fq.scrollIntoView({block:"start"}); break;
    case "checkout": ui.checkout=true; loadMun(); renderOverlays(); break;
    case "back": readCustomer(); ui.checkout=false; renderOverlays(); break;
    case "send": sendOrder(); break;
    case "copy-order": copy(orderText()); break;
    case "admin": openAdmin(); break;
    case "close-admin": ui.admin=false; ui.editId=null; if(ui.dirty) toast("Tus cambios no se publicaron."); draft=null; ui.dirty=false; render(); startAuto(); break;
    case "new": ui.editId="new"; ui._new=newProduct(); ui.confirmDel=false; renderOverlays(); scrollEditor(); break;
    case "cancel-edit": ui.editId=null; ui._new=null; renderOverlays(); break;
    case "use-price": var pr=calcPrice(); if(pr) document.getElementById("e-price").value=pr; break;
    case "save-prod":
      var p=currentEdit(); readEditor(p); var err=document.getElementById("e-err");
      if(!p.name){ err.textContent="Escribe el nombre del producto."; return; }
      if(!p.category){ err.textContent="Escribe una categoría."; return; }
      if(!p.price){ err.textContent="Escribe el precio de venta."; return; }
      if(p.oldPrice && p.oldPrice<=p.price) p.oldPrice=0;
      delete p.demo;
      if(ui.editId==="new"){ draft.products.unshift(p); ui._new=null; }
      ui.editId=null; ui.dirty=true; renderOverlays(); toast("Producto guardado. Pulsa “Publicar cambios” para que se vea."); break;
    case "ask-del": ui.confirmDel=true; readEditor(currentEdit()); renderOverlays(); break;
    case "del-prod": draft.products=draft.products.filter(function(x){return x.id!==ui.editId;}); ui.editId=null; ui.confirmDel=false; ui.dirty=true; renderOverlays(); break;
    case "del-demos": draft.products=draft.products.filter(function(x){return !x.demo;}); ui.dirty=true; renderOverlays(); break;
    case "save-settings":
      var s=draft.settings; s.whatsapp=document.getElementById("s-wa").value.replace(/\D/g,""); s.name=document.getElementById("s-name").value.trim()||"TODDO";
      s.instagram=document.getElementById("s-ig").value.trim();
      s.slogan=document.getElementById("s-slogan").value.trim(); s.strip=document.getElementById("s-strip").value.trim(); s.shippingNote=document.getElementById("s-ship").value.trim(); s.city=document.getElementById("s-city").value.trim();
      if(s.whatsapp && s.whatsapp.length===10) s.whatsapp="57"+s.whatsapp;
      ui.dirty=true; renderOverlays(); toast("Datos aplicados. Pulsa “Publicar cambios”."); break;
    case "publish": publish(); break;
  }
});
function scrollEditor(){ var e=document.getElementById("editor"); if(e) e.scrollIntoView({block:"start"}); }
document.addEventListener("input", function(ev){
  var el=ev.target;
  if(el.id==="qt-prod") ui.qtProd=el.value; if(el.id==="qt-det") ui.qtDet=el.value;
  if(el.classList && el.classList.contains("q")){ ui.q=el.value; var id=el.id, pos=el.selectionStart; render(); var q=document.getElementById(id); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){} } }
  if(/^k-/.test(el.id)) calcPrice();
  if(el.id==="c-city"||el.id==="c-dept"){ readCustomer(); refreshCheckout(); }
});
document.addEventListener("change", async function(ev){
  if(ev.target.id==="sort"){ ui.sort=ev.target.value; render(); }
  if(ev.target.id==="c-dept"){ readCustomer(); var cw=document.getElementById("c-city-wrap"); if(cw) cw.outerHTML=cityField(); refreshCheckout(); }
  if(ev.target.id==="c-city"){ readCustomer(); refreshCheckout(); }
  if(ev.target.name==="pay"){ customer.pay=ev.target.value; try{ localStorage.setItem("toddo-cliente", JSON.stringify(customer)); }catch(e){} var pb=document.getElementById("pay-box"); if(pb) pb.outerHTML=payChoiceHtml(); refreshCheckout(); }
  if(ev.target.id==="e-pics"){
    var p=currentEdit(); readEditor(p); var files=[].slice.call(ev.target.files||[]).slice(0,5-p.images.length);
    for(var i=0;i<files.length;i++){ try{ p.images.push(await compress(files[i],900,0.74)); }catch(e){ toast("Una foto no se pudo leer. Prueba con JPG o PNG."); } }
    renderOverlays();
  }
  if(ev.target.id==="b-up"){
    var fs=[].slice.call(ev.target.files||[]).slice(0,6-draft.brand.banners.length);
    for(var j=0;j<fs.length;j++){ try{ draft.brand.banners.push(await compress(fs[j],1400,0.78)); ui.dirty=true; }catch(e){ toast("Un banner no se pudo leer."); } }
    renderOverlays();
  }
});
document.addEventListener("submit", function(ev){ if(ev.target && ev.target.id==="quote-form"){ ev.preventDefault(); sendQuote(); } });
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape"&&ui.page){ ui.page=null; renderOverlays(); return; } if(ev.key==="Escape"&&ui.catMenu){ ui.catMenu=false; render(); return; } if(ev.key==="Escape"){ if(ui.view){ui.view=null;renderOverlays();} else if(ui.cartOpen){ui.cartOpen=false;ui.checkout=false;render();} } });

if(DATA.src){
  app.innerHTML='<div class="empty" style="padding:120px 16px">Cargando la tienda…</div>';
  fetch(DATA.src+"?v="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){ DATA=d; S=d.settings; P=d.products; B=d.brand||{banners:[]}; openFromHash(); render(); startAuto(); })
  .catch(function(){ app.innerHTML='<div class="empty" style="padding:120px 16px">No pudimos cargar los productos. Revisa tu conexión y recarga la página.</div>'; });
} else { openFromHash(); render(); startAuto(); }
(async function(){
  try{
    if(!window.claude || !window.claude.use) return;
    var u=await window.claude.use("user");
    if(u && await u.canEdit()){ ui.canEdit=true; render(); }
  }catch(e){}
})();
})();
</script>
